<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Quick Pay</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  .pay-card {
    padding: 20px;
    margin-bottom: 14px;
    border-radius: 20px;
  }

  .pay-label {
    font-size: 11px;
    color: #00ff88;
    opacity: 0.7;
    letter-spacing: 1.5px;
    font-weight: 800;
    display: block;
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  .pay-input-row {
    display: flex;
    gap: 10px;
  }

  .pay-input-row input {
    flex: 1;
    background: rgba(0, 20, 10, 0.6);
    border: 1px solid rgba(0, 255, 136, 0.25);
    color: #00ff88;
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    outline: none;
    font-family: inherit;
  }

  .pay-input-row input:focus {
    border-color: #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
  }

  .pay-input-row input::placeholder {
    color: #00ff88;
    opacity: 0.4;
  }

  .check-btn {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    color: #000000;
    border: none;
    padding: 0 22px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    letter-spacing: 0.5px;
    box-shadow: 0 4px 16px rgba(0, 255, 136, 0.4);
  }

  .check-btn:active {
    transform: scale(0.96);
  }

  .user-info-box {
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(0, 255, 136, 0.08);
    border: 1px solid rgba(0, 255, 136, 0.35);
    border-radius: 14px;
    padding: 14px;
    margin-top: 14px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .user-info-avatar {
    width: 52px;
    height: 52px;
    background: rgba(0, 255, 136, 0.15);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    overflow: hidden;
    flex-shrink: 0;
    border: 2px solid #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
  }

  .user-info-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .user-info-details {
    flex: 1;
    min-width: 0;
  }

  .user-info-name {
    font-weight: 800;
    font-size: 16px;
    color: #00ff88;
  }

  .user-info-id {
    color: #00ff88;
    opacity: 0.65;
    font-size: 12px;
    margin-top: 3px;
    font-family: 'SF Mono', 'Courier New', monospace;
  }

  .check-msg {
    margin-top: 12px;
    font-size: 13px;
    font-weight: 700;
    text-align: center;
  }

  .check-msg.success { color: #00ff88; text-shadow: 0 0 12px rgba(0, 255, 136, 0.5); }
  .check-msg.error { color: #ff6464; }

  .amount-input-wrap {
    display: flex;
    align-items: center;
    background: rgba(0, 20, 10, 0.6);
    border: 1px solid rgba(0, 255, 136, 0.25);
    border-radius: 14px;
    padding: 0 18px;
    margin-bottom: 12px;
  }

  .amount-input-wrap:focus-within {
    border-color: #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
  }

  .rupee-symbol {
    font-size: 26px;
    font-weight: 800;
    color: #00ff88;
  }

  .amount-input-wrap input {
    flex: 1;
    background: transparent;
    border: none;
    color: #00ff88;
    padding: 16px 10px;
    font-size: 24px;
    font-weight: 800;
    outline: none;
    font-family: inherit;
  }

  .amount-input-wrap input::placeholder {
    color: #00ff88;
    opacity: 0.4;
  }

  .quick-amounts {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .quick-amounts button {
    background: rgba(0, 255, 136, 0.08);
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.25);
    padding: 12px 6px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.2s;
  }

  .quick-amounts button:active {
    background: #00ff88;
    color: #000000;
    transform: scale(0.95);
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
  }

  .pay-balance-info {
    display: flex;
    justify-content: space-between;
    border-radius: 14px;
    padding: 14px 18px;
    margin-bottom: 14px;
    font-size: 14px;
    background: rgba(0, 20, 10, 0.5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 255, 136, 0.15);
  }

  .pay-balance-info span:first-child {
    color: #00ff88;
    opacity: 0.65;
    font-weight: 700;
  }

  .pay-balance-info span:last-child {
    color: #00ff88;
    font-weight: 800;
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
  }

  .pay-now-btn {
    width: 100%;
    background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
    color: #000000;
    border: none;
    padding: 18px;
    border-radius: 16px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 1px;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(0, 255, 136, 0.4);
    transition: all 0.2s;
    font-family: inherit;
  }

  .pay-now-btn:active {
    transform: scale(0.97);
  }

  /* ✅ Confirm Modal */
  .confirm-modal-content {
    text-align: center;
  }

  .confirm-icon {
    font-size: 52px;
    margin-bottom: 12px;
  }

  .confirm-details {
    background: rgba(0, 255, 136, 0.05);
    border: 1px solid rgba(0, 255, 136, 0.15);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 16px;
    text-align: left;
  }

  .confirm-row {
    display: flex;
    justify-content: space-between;
    padding: 8px 0;
    font-size: 13px;
  }

  .confirm-label { color: #00ff88; opacity: 0.65; font-weight: 700; }
  .confirm-value { color: #00ff88; font-weight: 800; max-width: 60%; text-align: right; word-break: break-all; }
  .confirm-value.mono { font-family: 'SF Mono', 'Courier New', monospace; }

  .confirm-balance-update {
    background: rgba(0, 255, 136, 0.04);
    border: 1px solid rgba(0, 255, 136, 0.15);
    border-radius: 12px;
    padding: 14px;
    margin: 12px 0;
    text-align: left;
  }

  .confirm-balance-title {
    font-size: 11px;
    color: #00ff88;
    opacity: 0.7;
    letter-spacing: 1.5px;
    font-weight: 800;
    margin-bottom: 10px;
    text-transform: uppercase;
  }

  .balance-update-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    font-size: 13px;
  }

  .balance-update-row span:first-child {
    color: #00ff88;
    opacity: 0.7;
    font-weight: 700;
  }

  .balance-update-row span:last-child {
    color: #00ff88;
    font-weight: 800;
    font-family: 'SF Mono', 'Courier New', monospace;
  }

  .confirm-buttons {
    display: flex;
    gap: 10px;
  }

  .confirm-cancel-btn {
    flex: 1;
    background: rgba(255, 100, 100, 0.1);
    color: #ff6464;
    border: 1px solid rgba(255, 100, 100, 0.3);
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
  }

  .confirm-ok-btn {
    flex: 1;
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    color: #000000;
    border: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    box-shadow: 0 4px 16px rgba(0, 255, 136, 0.4);
  }

  /* ✅ Success modal */
  .success-icon {
    font-size: 68px;
    margin-bottom: 12px;
    animation: bounceIn 0.5s ease;
  }

  @keyframes bounceIn {
    0% { transform: scale(0); opacity: 0; }
    50% { transform: scale(1.15); }
    100% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="iphone-frame">
  <div class="app">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title">💸 Quick Pay</div>
      <p class="page-sub">Send money to any user instantly</p>
    </div>

    <!-- Receiver Input -->
    <div class="pay-card glass">
      <label class="pay-label">📱 Receiver User ID</label>
      <div class="pay-input-row">
        <input type="number" id="payUserId" placeholder="Enter User ID" autocomplete="off" inputmode="numeric">
        <button class="check-btn" id="checkBtn" onclick="checkUser()">CHECK</button>
      </div>

      <div id="userInfoBox" class="user-info-box" style="display:none;">
        <div class="user-info-avatar" id="userInfoAvatar">👤</div>
        <div class="user-info-details">
          <div class="user-info-name" id="userInfoName">-</div>
          <div class="user-info-id" id="userInfoId">ID: -</div>
        </div>
      </div>

      <div id="userCheckMsg" class="check-msg"></div>
    </div>

    <!-- Amount Input -->
    <div class="pay-card glass" id="amountCard" style="display:none;">
      <label class="pay-label">💰 Amount</label>
      <div class="amount-input-wrap">
        <span class="rupee-symbol">₹</span>
        <input type="number" id="payAmount" placeholder="0" min="1" autocomplete="off" inputmode="decimal">
      </div>
      <div class="quick-amounts">
        <button onclick="setAmount(10)">₹10</button>
        <button onclick="setAmount(50)">₹50</button>
        <button onclick="setAmount(100)">₹100</button>
        <button onclick="setAmount(500)">₹500</button>
      </div>
    </div>

    <!-- Balance Info -->
    <div class="pay-balance-info" id="payBalanceInfo" style="display:none;">
      <span>💵 Your Balance:</span>
      <span id="payBalance">₹0.00</span>
    </div>

    <!-- Pay Button -->
    <button class="pay-now-btn" id="payNowBtn" onclick="initiatePay()" style="display:none;">
      💸 PAY NOW
    </button>

    <!-- Bottom Nav -->
    <nav class="bottom-nav glass-nav">
      <a href="/miniapp" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">HOME</span>
      </a>
      <a href="/miniapp/task" class="nav-item">
        <span class="nav-icon">📋</span>
        <span class="nav-label">TASK</span>
      </a>
      <a href="/miniapp/pay" class="nav-item active">
        <span class="nav-icon">💸</span>
        <span class="nav-label">PAY</span>
      </a>
      <a href="/miniapp/profile" class="nav-item">
        <span class="nav-icon">👤</span>
        <span class="nav-label">PROFILE</span>
      </a>
    </nav>

  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal" id="confirmModal">
  <div class="modal-content glass confirm-modal-content">
    <div class="confirm-icon">⚠️</div>
    <h3>Confirm Payment</h3>

    <div class="confirm-details">
      <div class="confirm-row">
        <span class="confirm-label">👤 Receiver</span>
        <span class="confirm-value" id="confirmName">-</span>
      </div>
      <div class="confirm-row">
        <span class="confirm-label">🆔 ID</span>
        <span class="confirm-value mono" id="confirmUserId">-</span>
      </div>
      <div class="confirm-row">
        <span class="confirm-label">💰 Amount</span>
        <span class="confirm-value" id="confirmAmount">₹0</span>
      </div>
    </div>

    <div class="confirm-balance-update" id="balanceUpdateBox">
      <div class="confirm-balance-title">📊 Balance Update</div>
      <div class="balance-update-row" id="yourBalanceRow">
        <span>💵 Your</span>
        <span id="yourBalanceChange">₹0 → ₹0</span>
      </div>
      <div class="balance-update-row">
        <span>💰 Receiver</span>
        <span id="receiverBalanceChange">₹0 → ₹0</span>
      </div>
    </div>

    <div class="confirm-buttons">
      <button class="confirm-cancel-btn" onclick="cancelPay()">❌ CANCEL</button>
      <button class="confirm-ok-btn" id="confirmBtn" onclick="confirmPay()">✅ CONFIRM</button>
    </div>
  </div>
</div>

<!-- SUCCESS MODAL -->
<div class="modal" id="successModal">
  <div class="modal-content glass confirm-modal-content">
    <div class="success-icon">✅</div>
    <h3>Payment Successful!</h3>
    <p class="confirm-subtitle" id="successMsg">Money sent successfully.</p>
    <button class="confirm-ok-btn" onclick="closeSuccess()" style="width:100%;margin-top:16px;">OK</button>
  </div>
</div>

<script>
// ============================================================
// 💸 QUICK PAY
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
}

const MY_ID = tg?.initDataUnsafe?.user?.id;

let checkedUser = null;
let myBalance = 0;
let isAdminUser = false;

// ============================================================
// 🔔 TOAST
// ============================================================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 2000);
}

function showMsg(msg, type = 'error') {
  const el = document.getElementById('userCheckMsg');
  el.className = 'check-msg ' + type;
  el.textContent = msg;
}

function clearMsg() {
  document.getElementById('userCheckMsg').textContent = '';
}

// ============================================================
// 💰 LOAD MY BALANCE + ADMIN STATUS
// ============================================================
async function loadMyBalance() {
  if (!MY_ID) return;
  try {
    const [userRes, adminRes] = await Promise.all([
      fetch(`/miniapp/api/user/${MY_ID}`),
      fetch(`/miniapp/api/is-admin/${MY_ID}`)
    ]);

    const userData = await userRes.json();
    const adminData = await adminRes.json();

    if (userData.success) {
      myBalance = userData.user.balance || 0;
      document.getElementById('payBalance').textContent = '₹' + myBalance.toFixed(2);
    }
    isAdminUser = adminData.isAdmin === true;
  } catch (e) {
    console.error('Balance load:', e);
  }
}

// ============================================================
// 🔍 CHECK USER
// ============================================================
async function checkUser() {
  clearMsg();
  const input = document.getElementById('payUserId');
  const userId = input.value.trim();
  const btn = document.getElementById('checkBtn');

  if (!userId || isNaN(userId)) {
    showMsg('❌ Enter a valid User ID', 'error');
    return;
  }

  if (parseInt(userId) === MY_ID) {
    showMsg('❌ Cannot send to yourself', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = '⏳';
  document.getElementById('userInfoBox').style.display = 'none';
  document.getElementById('amountCard').style.display = 'none';
  document.getElementById('payBalanceInfo').style.display = 'none';
  document.getElementById('payNowBtn').style.display = 'none';

  try {
    const res = await fetch(`/miniapp/api/check-user/${userId}`);
    const data = await res.json();

    if (!data.success) {
      showMsg(`❌ ${data.error || 'User not found'}`, 'error');
      btn.disabled = false;
      btn.textContent = 'CHECK';
      return;
    }

    checkedUser = data.user;

    document.getElementById('userInfoName').textContent = data.user.firstName || 'User';
    document.getElementById('userInfoId').textContent = 'ID: ' + data.user.userId;

    const avatar = document.getElementById('userInfoAvatar');
    if (data.user.photoUrl) {
      avatar.innerHTML = `<img src="${data.user.photoUrl}" alt="">`;
    } else {
      avatar.textContent = (data.user.firstName || 'U').charAt(0).toUpperCase();
    }

    document.getElementById('userInfoBox').style.display = 'flex';
    document.getElementById('amountCard').style.display = 'block';
    document.getElementById('payBalanceInfo').style.display = 'flex';
    document.getElementById('payNowBtn').style.display = 'block';

    showMsg('✅ User found!', 'success');
    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    setTimeout(() => document.getElementById('payAmount').focus(), 300);
  } catch (e) {
    showMsg('❌ Network error', 'error');
    console.error(e);
  }

  btn.disabled = false;
  btn.textContent = 'CHECK';
}

// ============================================================
// 💰 QUICK AMOUNT
// ============================================================
function setAmount(amt) {
  document.getElementById('payAmount').value = amt;
  if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
}

// ============================================================
// 💸 INITIATE PAY
// ============================================================
function initiatePay() {
  clearMsg();
  if (!checkedUser) { showToast('❌ Check user first'); return; }

  const amtStr = document.getElementById('payAmount').value.trim();
  const amt = parseFloat(amtStr);

  if (isNaN(amt) || amt <= 0) { showToast('❌ Enter valid amount'); return; }

  // ✅ Regular user — balance check
  if (!isAdminUser && amt > myBalance) {
    showToast('❌ Insufficient balance');
    return;
  }

  // ✅ Fill confirm modal
  document.getElementById('confirmName').textContent = checkedUser.firstName || 'User';
  document.getElementById('confirmUserId').textContent = checkedUser.userId;
  document.getElementById('confirmAmount').textContent = '₹' + amt.toFixed(2);

  // ✅ Balance update info
  if (isAdminUser) {
    document.getElementById('yourBalanceRow').style.display = 'none';
  } else {
    document.getElementById('yourBalanceRow').style.display = 'flex';
    document.getElementById('yourBalanceChange').textContent =
      `₹${myBalance.toFixed(2)} → ₹${(myBalance - amt).toFixed(2)}`;
  }
  document.getElementById('receiverBalanceChange').textContent =
    `₹${(checkedUser.balance || 0).toFixed(2)} → ₹${((checkedUser.balance || 0) + amt).toFixed(2)}`;

  document.getElementById('confirmModal').classList.add('active');
}

// ============================================================
// ❌ CANCEL
// ============================================================
function cancelPay() {
  document.getElementById('confirmModal').classList.remove('active');
}

// ============================================================
// ✅ CONFIRM PAY
// ============================================================
async function confirmPay() {
  const amt = parseFloat(document.getElementById('payAmount').value);
  const btn = document.getElementById('confirmBtn');
  if (!checkedUser || isNaN(amt) || amt <= 0) { showToast('❌ Invalid data'); return; }

  btn.disabled = true;
  btn.innerHTML = '⏳ Sending...';

  try {
    const res = await fetch('/miniapp/api/quick-pay', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senderId: MY_ID, receiverId: checkedUser.userId, amount: amt })
    });
    const data = await res.json();

    document.getElementById('confirmModal').classList.remove('active');

    if (!data.success) {
      showToast(`❌ ${data.error || 'Payment failed'}`);
      btn.disabled = false;
      btn.textContent = '✅ CONFIRM';
      return;
    }

    document.getElementById('successMsg').textContent =
      `₹${amt.toFixed(2)} sent to ${checkedUser.firstName || 'User'}`;
    document.getElementById('successModal').classList.add('active');

    if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

    document.getElementById('payUserId').value = '';
    document.getElementById('payAmount').value = '';
    document.getElementById('userInfoBox').style.display = 'none';
    document.getElementById('amountCard').style.display = 'none';
    document.getElementById('payBalanceInfo').style.display = 'none';
    document.getElementById('payNowBtn').style.display = 'none';
    clearMsg();
    checkedUser = null;
    await loadMyBalance();
  } catch (e) {
    showToast('❌ Network error');
    document.getElementById('confirmModal').classList.remove('active');
  }
  btn.disabled = false;
  btn.textContent = '✅ CONFIRM';
}

function closeSuccess() {
  document.getElementById('successModal').classList.remove('active');
}

// ============================================================
// 🚀 INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  if (!MY_ID) {
    document.body.innerHTML = `<div style="padding:50px;text-align:center;color:#00ff88;"><h2>⚠️ Open from Telegram</h2></div>`;
    return;
  }
  await loadMyBalance();

  document.getElementById('payUserId')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') checkUser();
  });
  document.getElementById('payAmount')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') initiatePay();
  });
});

document.getElementById('confirmModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'confirmModal') cancelPay();
});
document.getElementById('successModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'successModal') closeSuccess();
});
document.addEventListener('gesturestart', e => e.preventDefault());
</script>

</body>
</html>
