<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   VERIFY PAGE — Premium Styles
   ═══════════════════════════════════════════════════════ */

/* ───── SCROLL FIX ───── */
html, body {
  height: auto !important;
  min-height: 100vh !important;
  max-height: none !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
  -webkit-overflow-scrolling: touch !important;
  overscroll-behavior-y: auto !important;
  touch-action: pan-y !important;
  background: #000000;
  color: #00cc6a;
}

.verify-app {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

/* ───── TOP BAR ───── */
.verify-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 12px;
  gap: 12px;
}

.back-btn {
  background: rgba(0, 255, 136, 0.06);
  border: 1.5px solid rgba(0, 255, 136, 0.18);
  color: #00cc6a;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-family: inherit;
  padding: 0;
  flex-shrink: 0;
}

.back-btn .icon {
  width: 20px;
  height: 20px;
  stroke: #00cc6a;
}

.back-btn:active {
  transform: scale(0.92);
  background: rgba(0, 255, 136, 0.15);
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.25);
}

.topbar-title {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: 0.5px;
  text-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(0, 255, 136, 0.06);
  border: 1.5px solid rgba(0, 255, 136, 0.20);
  border-radius: 20px;
  font-size: 10.5px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.3s;
  flex-shrink: 0;
}

.status-badge .dot {
  width: 7px;
  height: 7px;
  background: #00ff88;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ff88;
  animation: pulseDot 1.5s infinite;
}

.status-badge.danger {
  background: rgba(255, 77, 77, 0.08);
  border-color: rgba(255, 77, 77, 0.35);
  color: #ff4d4d;
}

.status-badge.danger .dot {
  background: #ff4d4d;
  box-shadow: 0 0 10px #ff4d4d;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}

/* ───── USER CARD ───── */
.user-top-info {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: rgba(0, 15, 8, 0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 255, 136, 0.10);
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  animation: cardSlideIn 0.4s ease backwards;
}

.user-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.08);
  border: 2.5px solid rgba(0, 255, 136, 0.35);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 18px rgba(0, 255, 136, 0.25);
  position: relative;
}

.user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-avatar .icon {
  width: 26px;
  height: 26px;
  stroke: #00ff88;
  opacity: 0.8;
}

.user-avatar::after {
  content: '';
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  background: #00ff88;
  border: 2.5px solid #000000;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ff88;
}

.user-details {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-size: 16px;
  font-weight: 800;
  color: #00ff88;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.2px;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
}

.user-id {
  font-size: 11.5px;
  color: #00cc6a;
  opacity: 0.6;
  font-family: 'SF Mono', 'Courier New', monospace;
  margin-bottom: 2px;
  font-weight: 600;
}

.user-handle {
  font-size: 12px;
  color: #00cc6a;
  font-weight: 700;
  text-shadow: 0 0 6px rgba(0, 255, 136, 0.25);
}

/* ───── MAIN CARD ───── */
.main-card {
  background: linear-gradient(145deg,
    rgba(0, 255, 136, 0.06),
    rgba(0, 255, 136, 0.02));
  backdrop-filter: blur(20px);
  border: 1.5px solid rgba(0, 255, 136, 0.18);
  border-radius: 22px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(0, 255, 136, 0.08);
  animation: cardSlideIn 0.4s ease 0.05s backwards;
  transition: all 0.3s;
}

.main-card.failed {
  background: linear-gradient(145deg,
    rgba(255, 100, 100, 0.06),
    rgba(255, 100, 100, 0.02));
  border-color: rgba(255, 100, 100, 0.25);
}

.main-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg,
    transparent,
    rgba(0, 255, 136, 0.6),
    transparent);
  animation: cardShine 3s infinite;
}

.main-card.failed::before {
  background: linear-gradient(90deg,
    transparent,
    rgba(255, 100, 100, 0.6),
    transparent);
}

@keyframes cardShine {
  0% { left: -100%; }
  100% { left: 100%; }
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(0, 255, 136, 0.10);
}

.card-label {
  font-size: 10.5px;
  color: #00cc6a;
  letter-spacing: 1.5px;
  font-weight: 800;
  text-transform: uppercase;
  opacity: 0.85;
  display: flex;
  align-items: center;
  gap: 6px;
}

.card-label .icon {
  width: 12px;
  height: 12px;
  stroke: #00cc6a;
}

.card-status-icon {
  width: 32px;
  height: 32px;
  border-radius: 10px;
  background: rgba(0, 255, 136, 0.08);
  border: 1px solid rgba(0, 255, 136, 0.20);
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.3s;
}

.card-status-icon .icon {
  width: 18px;
  height: 18px;
  stroke: #00ff88;
  filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.4));
}

.card-status-icon.failed {
  background: rgba(255, 100, 100, 0.08);
  border-color: rgba(255, 100, 100, 0.25);
}

.card-status-icon.failed .icon {
  stroke: #ff4d4d;
  filter: drop-shadow(0 0 6px rgba(255, 77, 77, 0.4));
}

.card-content {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.field-label {
  font-size: 9.5px;
  color: #00cc6a;
  opacity: 0.55;
  letter-spacing: 1.5px;
  font-weight: 800;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 6px;
}

.field-label .icon {
  width: 10px;
  height: 10px;
  stroke: #00cc6a;
}

.field-value {
  font-size: 15px;
  font-weight: 800;
  color: #00ff88;
  font-family: 'SF Mono', 'Courier New', monospace;
  word-break: break-all;
  letter-spacing: 0.5px;
  text-shadow: 0 0 8px rgba(0, 255, 136, 0.25);
}

.name-value {
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: 0.2px;
}

.field-handle {
  font-size: 12.5px;
  color: #00cc6a;
  opacity: 0.8;
  font-weight: 700;
}

/* Bot photo in card */
.card-bot-photo {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid rgba(0, 255, 136, 0.10);
  display: none;
  justify-content: center;
}

.card-bot-photo.active {
  display: flex;
}

.card-bot-photo img {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #00ff88;
  box-shadow:
    0 0 25px rgba(0, 255, 136, 0.4),
    0 0 50px rgba(0, 255, 136, 0.15);
  animation: botPhotoGlow 3s ease-in-out infinite alternate;
}

@keyframes botPhotoGlow {
  from {
    box-shadow:
      0 0 25px rgba(0, 255, 136, 0.4),
      0 0 50px rgba(0, 255, 136, 0.15);
  }
  to {
    box-shadow:
      0 0 40px rgba(0, 255, 136, 0.6),
      0 0 80px rgba(0, 255, 136, 0.25);
  }
}

/* ───── STATUS SECTION ───── */
.status-section {
  text-align: center;
  padding: 8px 0;
  animation: cardSlideIn 0.4s ease 0.1s backwards;
}

.status-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}

.status-title .icon {
  width: 20px;
  height: 20px;
  stroke: currentColor;
}

.status-title.error {
  color: #ff4d4d;
  text-shadow: 0 0 15px rgba(255, 77, 77, 0.35);
}

.status-title.success {
  color: #00ff88;
  text-shadow: 0 0 15px rgba(0, 255, 136, 0.4);
}

.status-title.loading {
  color: #ffa500;
  text-shadow: 0 0 15px rgba(255, 165, 0, 0.35);
}

.status-subtitle {
  font-size: 12.5px;
  color: #00cc6a;
  opacity: 0.6;
  line-height: 1.55;
  max-width: 320px;
  margin: 0 auto;
  font-weight: 600;
}

/* ───── BOT INFO CARD ───── */
.bot-info-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(0, 15, 8, 0.55);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 255, 136, 0.10);
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  animation: cardSlideIn 0.4s ease 0.15s backwards;
  transition: all 0.3s;
}

.bot-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.08);
  border: 2.5px solid rgba(0, 255, 136, 0.35);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
}

.bot-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.bot-avatar .icon {
  width: 22px;
  height: 22px;
  stroke: #00ff88;
}

.bot-details {
  flex: 1;
  min-width: 0;
}

.bot-name {
  font-size: 14px;
  font-weight: 800;
  color: #00ff88;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.3px;
  text-shadow: 0 0 8px rgba(0, 255, 136, 0.25);
}

.bot-status {
  font-size: 11.5px;
  color: #00cc6a;
  opacity: 0.75;
  font-weight: 700;
}

.bot-check {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.08);
  border: 1.5px solid rgba(0, 255, 136, 0.22);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.3s;
}

.bot-check .icon {
  width: 16px;
  height: 16px;
  stroke: #00ff88;
}

.bot-check.failed {
  background: rgba(255, 100, 100, 0.08);
  border-color: rgba(255, 100, 100, 0.25);
}

.bot-check.failed .icon {
  stroke: #ff4d4d;
}

.bot-check.loading .icon {
  animation: spin 1.2s linear infinite;
  stroke: #ffa500;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ───── CONTINUE BUTTON ───── */
.continue-btn {
  width: 100%;
  background: linear-gradient(135deg, #00ff88, #00cc6a);
  color: #000000;
  border: none;
  padding: 17px;
  border-radius: 16px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 8px 28px rgba(0, 255, 136, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.25);
  transition: transform 0.15s;
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  animation: cardSlideIn 0.4s ease 0.2s backwards;
}

.continue-btn.active {
  display: flex;
}

.continue-btn .icon {
  stroke: #000000;
  width: 18px;
  height: 18px;
}

.continue-btn:active {
  transform: scale(0.97);
}

.continue-btn.retry {
  background: linear-gradient(135deg, #ffa500, #ff8c00);
}

/* ───── FOOTER ───── */
.verify-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 11.5px;
  color: #00cc6a;
  opacity: 0.5;
  padding: 8px 0;
  margin-top: auto;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.lock-icon {
  display: flex;
  align-items: center;
  justify-content: center;
}

.lock-icon .icon {
  width: 14px;
  height: 14px;
  stroke: #00cc6a;
  filter: drop-shadow(0 0 6px rgba(0, 255, 136, 0.3));
}

/* ───── RESPONSIVE ───── */
@media (max-width: 380px) {
  .topbar-title { font-size: 13px; }
  .status-badge { padding: 6px 10px; font-size: 9.5px; }
  .user-name { font-size: 14px; }
  .status-title { font-size: 16px; }
  .card-bot-photo img { width: 70px; height: 70px; }
  .continue-btn { font-size: 14px; padding: 15px; }
}

/* ───── SAFE AREA ───── */
@supports (padding: env(safe-area-inset-bottom)) {
  .verify-app {
    padding-bottom: calc(40px + env(safe-area-inset-bottom));
  }
}

/* iOS Safari */
@supports (-webkit-touch-callout: none) {
  html, body {
    height: auto !important;
    min-height: -webkit-fill-available !important;
  }
  .verify-app {
    min-height: -webkit-fill-available !important;
  }
}
</style>
</head>
<body>

<div class="verify-app">

  <!-- ═══ TOP BAR ═══ -->
  <header class="verify-topbar">
    <button class="back-btn" onclick="goHome()">
      <i data-lucide="arrow-left" class="icon"></i>
    </button>
    <div class="topbar-title">Device Verification</div>
    <div class="status-badge" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Checking</span>
    </div>
  </header>

  <!-- ═══ USER INFO ═══ -->
  <div class="user-top-info">
    <div class="user-avatar" id="userAvatar">
      <i data-lucide="user" class="icon" id="userFallback"></i>
      <img id="userImg" src="" alt="" style="display:none;" onerror="handleUserPhotoError()">
    </div>
    <div class="user-details">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-id" id="userId">ID: -</div>
      <div class="user-handle" id="userHandle">@-</div>
    </div>
  </div>

  <!-- ═══ MAIN CARD ═══ -->
  <div class="main-card" id="mainCard">
    <div class="card-header">
      <span class="card-label">
        <i data-lucide="shield-check" class="icon"></i>
        <span>Device Verification</span>
      </span>
      <div class="card-status-icon" id="cardStatusIcon">
        <i data-lucide="loader-2" class="icon"></i>
      </div>
    </div>

    <div class="card-content">
      <div class="card-field">
        <div class="field-label">
          <i data-lucide="badge" class="icon"></i>
          <span>Telegram ID</span>
        </div>
        <div class="field-value" id="cardTelegramId">-</div>
      </div>

      <div class="card-field">
        <div class="field-label">
          <i data-lucide="user" class="icon"></i>
          <span>Account</span>
        </div>
        <div class="field-value name-value" id="cardName">-</div>
        <div class="field-handle" id="cardHandle">@-</div>
      </div>
    </div>

    <div class="card-bot-photo" id="cardBotPhoto">
      <img id="botPhotoImg" src="" alt="Bot" onerror="handleBotPhotoError()">
    </div>
  </div>

  <!-- ═══ STATUS ═══ -->
  <div class="status-section">
    <div class="status-title loading" id="statusTitle">
      <i data-lucide="loader-2" class="icon"></i>
      <span>Verifying...</span>
    </div>
    <div class="status-subtitle" id="statusSubtitle">Please wait while we verify your device.</div>
  </div>

  <!-- ═══ BOT INFO ═══ -->
  <div class="bot-info-card">
    <div class="bot-avatar" id="botAvatar">
      <i data-lucide="bot" class="icon" id="botFallback"></i>
      <img id="botPhotoSmall" src="" alt="Bot" style="display:none;" onerror="handleBotPhotoError()">
    </div>
    <div class="bot-details">
      <div class="bot-name" id="botName">TASK EARN BOT</div>
      <div class="bot-status" id="botStatus">Verifying access...</div>
    </div>
    <div class="bot-check loading" id="botCheck">
      <i data-lucide="loader-2" class="icon"></i>
    </div>
  </div>

  <!-- ═══ CONTINUE BUTTON ═══ -->
  <button class="continue-btn" id="continueBtn" onclick="continueToBot()">
    <i data-lucide="arrow-right" class="icon"></i>
    <span>Continue to Bot</span>
  </button>

  <!-- ═══ FOOTER ═══ -->
  <div class="verify-footer">
    <span class="lock-icon"><i data-lucide="lock" class="icon"></i></span>
    <span>Your access is ready when you are.</span>
  </div>

</div>

<script>
// ============================================================
// 🔐 VERIFY PAGE LOGIC
// ============================================================
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
  try { if (tg.enableVerticalSwipes) tg.enableVerticalSwipes(); } catch (e) {}
}

const userId = tg?.initDataUnsafe?.user?.id;
const tgUser = tg?.initDataUnsafe?.user;

let deviceHash = null;
let verified = false;
let verifyData = null;

// ============================================================
// 🎯 ICONS
// ============================================================
function renderIcons() {
  if (window.lucide && typeof window.lucide.createIcons === 'function') {
    try { window.lucide.createIcons(); } catch (e) {}
  }
}

// ============================================================
// 🔓 FORCE SCROLL
// ============================================================
function forceScrollEnable() {
  document.body.style.overflow = 'auto';
  document.body.style.height = 'auto';
  document.body.style.maxHeight = 'none';
  document.body.style.touchAction = 'pan-y';

  document.documentElement.style.overflow = 'auto';
  document.documentElement.style.height = 'auto';
  document.documentElement.style.maxHeight = 'none';
}

forceScrollEnable();
setTimeout(forceScrollEnable, 200);
setTimeout(forceScrollEnable, 800);

// ============================================================
// 🎨 UTILITIES
// ============================================================
function showToast(msg, duration = 2500) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, duration);
}

function haptic(type = 'light') {
  if (tg?.HapticFeedback) {
    if (type === 'success') tg.HapticFeedback.notificationOccurred('success');
    else if (type === 'error') tg.HapticFeedback.notificationOccurred('error');
    else tg.HapticFeedback.impactOccurred(type);
  }
}

// ============================================================
// 🏠 GO HOME
// ============================================================
function goHome() {
  haptic('light');
  window.location.href = '/miniapp';
}

// ============================================================
// 🔒 DEVICE HASH GENERATOR (with fallback)
// ============================================================
async function generateDeviceHash() {
  // Check cache first
  try {
    const cached = localStorage.getItem('device_hash');
    if (cached && cached.length > 10) return cached;
  } catch (e) {}

  const deviceData = [
    tgUser?.id || 'unknown',
    tgUser?.language_code || 'unknown',
    navigator.userAgent || '',
    navigator.language || '',
    navigator.platform || '',
    screen.width + 'x' + screen.height,
    screen.colorDepth || 0,
    new Date().getTimezoneOffset(),
    Intl.DateTimeFormat().resolvedOptions().timeZone || '',
    navigator.hardwareConcurrency || 0
  ].join('|');

  let hashHex = null;

  // Try SHA-256 (may fail on iOS WebView)
  try {
    if (window.crypto && window.crypto.subtle) {
      const encoder = new TextEncoder();
      const data = encoder.encode(deviceData);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', data);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {
    console.warn('SHA-256 unavailable, using fallback:', e.message);
  }

  // Fallback hash
  if (!hashHex) {
    let h = 0;
    for (let i = 0; i < deviceData.length; i++) {
      h = ((h << 5) - h) + deviceData.charCodeAt(i);
      h |= 0;
    }
    hashHex = 'fb_' + Math.abs(h).toString(36) + '_' + deviceData.length;
  }

  const finalHash = 'dev_' + hashHex.substring(0, 40);

  try { localStorage.setItem('device_hash', finalHash); } catch (e) {}

  return finalHash;
}

// ============================================================
// 👤 LOAD USER INFO
// ============================================================
function loadUserInfo() {
  if (!tgUser) return;

  document.getElementById('userName').textContent = tgUser.first_name || 'User';
  document.getElementById('userId').textContent = 'ID: ' + (tgUser.id || '-');
  document.getElementById('userHandle').textContent = tgUser.username ? '@' + tgUser.username : '@-';

  document.getElementById('cardTelegramId').textContent = tgUser.id || '-';
  document.getElementById('cardName').textContent = tgUser.first_name || 'User';
  document.getElementById('cardHandle').textContent = tgUser.username ? '@' + tgUser.username : '@-';
}

// ============================================================
// 📸 LOAD USER PHOTO
// ============================================================
async function loadUserPhoto() {
  if (!userId) return;
  try {
    const res = await fetch(`/miniapp/api/profile-photo/${userId}`);
    const data = await res.json();
    if (data.success && data.photoUrl) {
      const img = document.getElementById('userImg');
      img.src = data.photoUrl;
      img.style.display = 'block';
      const fallback = document.getElementById('userFallback');
      if (fallback) fallback.style.display = 'none';
    }
  } catch (e) {
    console.warn('Photo load failed');
  }
}

function handleUserPhotoError() {
  const img = document.getElementById('userImg');
  img.style.display = 'none';
  const fallback = document.getElementById('userFallback');
  if (fallback) fallback.style.display = 'block';
}

function handleBotPhotoError() {
  const botImg = document.getElementById('botPhotoImg');
  const botSmall = document.getElementById('botPhotoSmall');
  if (botImg) botImg.style.display = 'none';
  if (botSmall) botSmall.style.display = 'none';
  const fallback = document.getElementById('botFallback');
  if (fallback) fallback.style.display = 'block';
}

// ============================================================
// 🚀 MAIN VERIFY FLOW
// ============================================================
async function runVerification() {
  if (!userId) {
    setStatus('error', 'x-circle', 'Please open from Telegram', 'This page requires Telegram Mini App.');
    setBadge('Error', true);
    setCardIcon('x-circle', true);
    setBotStatus('Access denied', 'x-circle', true);
    showContinueButton('retry', 'Open from Telegram');
    return;
  }

  try {
    // 1. Generate device hash
    document.getElementById('statusSubtitle').textContent = 'Reading device info...';
    deviceHash = await generateDeviceHash();

    // 2. Fetch verification status
    document.getElementById('statusSubtitle').textContent = 'Checking verification status...';

    let data = { success: false };
    try {
      const res = await fetch(`/miniapp/api/verify/${userId}`);
      data = await res.json();
    } catch (e) {
      console.warn('Verify endpoint failed:', e);
    }

    // 3. Load bot info if available
    if (data.success) {
      verifyData = data;

      if (data.botName) {
        document.getElementById('botName').textContent = data.botName;
      }

      if (data.botPhotoUrl) {
        const botImg = document.getElementById('botPhotoImg');
        const botSmall = document.getElementById('botPhotoSmall');
        botImg.src = data.botPhotoUrl;
        botImg.style.display = 'block';
        botSmall.src = data.botPhotoUrl;
        botSmall.style.display = 'block';

        document.getElementById('cardBotPhoto').classList.add('active');
        document.getElementById('botFallback').style.display = 'none';
      }
    }

    // 4. Verification disabled → auto-success
    if (data.verifyEnabled === false) {
      setStatus('success', 'check-circle-2', 'Verified', 'Device verification is disabled.');
      setBadge('Verified', false);
      setCardIcon('check-circle-2', false);
      setBotStatus('Access granted', 'check-circle-2', false);
      showContinueButton('normal', 'Continue to Bot');
      verified = true;
      haptic('success');
      return;
    }

    // 5. Already verified
    if (data.verified === true) {
      setStatus('success', 'check-circle-2', 'Already Verified', 'Your device is verified. Welcome back!');
      setBadge('Verified', false);
      setCardIcon('check-circle-2', false);
      setBotStatus('Account verified', 'check-circle-2', false);
      showContinueButton('normal', 'Continue to Bot');
      verified = true;
      haptic('success');
      return;
    }

    // 6. Submit for verification
    document.getElementById('statusSubtitle').textContent = 'Verifying your device...';

    let submitData = { success: false, verified: false };
    try {
      const submitRes = await fetch('/miniapp/api/verify/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: userId,
          deviceHash: deviceHash
        })
      });
      submitData = await submitRes.json();
    } catch (e) {
      console.warn('Submit endpoint failed:', e);
    }

    if (submitData.success && submitData.verified) {
      setStatus('success', 'check-circle-2', 'Verified', 'Your device has been verified successfully!');
      setBadge('Verified', false);
      setCardIcon('check-circle-2', false);
      setBotStatus('Account verified', 'check-circle-2', false);
      showContinueButton('normal', 'Continue to Bot');
      verified = true;
      haptic('success');
    } else if (submitData.success && !submitData.verified) {
      // Endpoint exists but verification not done
      const reason = submitData.reason || 'Verification pending admin review.';
      setStatus('loading', 'clock', 'Pending Review', reason);
      setBadge('Pending', false);
      setCardIcon('clock', false);
      setBotStatus('Awaiting approval', 'clock', false);
      showContinueButton('retry', 'Try Again');
      haptic('light');
    } else {
      // Endpoint failed → still allow continue (fail-safe)
      setStatus('success', 'check-circle-2', 'Verified', 'Proceed to use the bot.');
      setBadge('Verified', false);
      setCardIcon('check-circle-2', false);
      setBotStatus('Access granted', 'check-circle-2', false);
      showContinueButton('normal', 'Continue to Bot');
      verified = true;
      haptic('success');
    }

  } catch (e) {
    console.error('Verify error:', e);
    // Fail-safe: allow proceed
    setStatus('success', 'check-circle-2', 'Ready', 'Proceed to use the bot.');
    setBadge('Ready', false);
    setCardIcon('check-circle-2', false);
    setBotStatus('Access granted', 'check-circle-2', false);
    showContinueButton('normal', 'Continue to Bot');
    verified = true;
  }

  setTimeout(forceScrollEnable, 200);
}

// ============================================================
// 🎨 STATUS HELPERS
// ============================================================
function setStatus(type, iconName, title, subtitle) {
  const titleEl = document.getElementById('statusTitle');
  const iconEl = titleEl.querySelector('i');
  const spanEl = titleEl.querySelector('span');

  if (iconEl) iconEl.setAttribute('data-lucide', iconName);
  if (spanEl) spanEl.textContent = title;

  titleEl.className = 'status-title ' + type;
  document.getElementById('statusSubtitle').textContent = subtitle;

  renderIcons();
}

function setBadge(text, isDanger) {
  document.getElementById('statusText').textContent = text;
  const badge = document.getElementById('statusBadge');
  badge.classList.toggle('danger', isDanger);
}

function setCardIcon(iconName, isFailed) {
  const container = document.getElementById('cardStatusIcon');
  container.classList.toggle('failed', isFailed);
  container.innerHTML = `<i data-lucide="${iconName}" class="icon"></i>`;
  renderIcons();
}

function setBotStatus(text, iconName, isFailed) {
  document.getElementById('botStatus').textContent = text;
  const container = document.getElementById('botCheck');
  container.classList.toggle('failed', isFailed);
  container.classList.remove('loading');
  container.innerHTML = `<i data-lucide="${iconName}" class="icon"></i>`;
  renderIcons();
}

function showContinueButton(mode, text) {
  const btn = document.getElementById('continueBtn');
  const iconName = mode === 'retry' ? 'rotate-ccw' : 'arrow-right';
  btn.classList.toggle('retry', mode === 'retry');
  btn.innerHTML = `<i data-lucide="${iconName}" class="icon"></i><span>${text}</span>`;
  btn.classList.add('active');
  renderIcons();
}

// ============================================================
// 🚀 CONTINUE
// ============================================================
function continueToBot() {
  if (!verified) {
    // Retry flow
    haptic('light');
    document.getElementById('continueBtn').classList.remove('active');
    runVerification();
    return;
  }

  haptic('success');
  // Navigate to Home inside mini app
  window.location.href = '/miniapp';
}

// ============================================================
// 🎬 INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  forceScrollEnable();
  renderIcons();

  loadUserInfo();

  // Enable Telegram BackButton
  try {
    if (tg.BackButton) {
      tg.BackButton.show();
      tg.BackButton.onClick(() => {
        goHome();
      });
    }
  } catch (e) {}

  await loadUserPhoto();
  await runVerification();

  setTimeout(renderIcons, 500);
  setTimeout(renderIcons, 1500);
  setTimeout(forceScrollEnable, 800);
});

document.addEventListener('gesturestart', e => e.preventDefault());

// Expose globals
window.goHome = goHome;
window.continueToBot = continueToBot;
window.handleUserPhotoError = handleUserPhotoError;
window.handleBotPhotoError = handleBotPhotoError;
</script>
