<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Device Verification</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ═══════════════════════════════════════════════════════
   VERIFY PAGE — Premium Styles (Green Glow)
   ═══════════════════════════════════════════════════════ */

.verify-app {
  max-width: 480px;
  margin: 0 auto;
  padding: 20px 16px 40px;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* ───── TOP BAR ───── */
.verify-topbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 0 12px;
  gap: 12px;
}

.back-btn {
  background: rgba(0, 255, 136, 0.08);
  border: 1.5px solid rgba(0, 255, 136, 0.25);
  color: #00ff88;
  width: 40px;
  height: 40px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  font-family: inherit;
}

.back-btn:active {
  transform: scale(0.92);
  background: rgba(0, 255, 136, 0.2);
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
}

.topbar-title {
  flex: 1;
  text-align: center;
  font-size: 15px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: 0.5px;
  text-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
}

.status-badge {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 8px 12px;
  background: rgba(0, 255, 136, 0.08);
  border: 1.5px solid rgba(0, 255, 136, 0.25);
  border-radius: 20px;
  font-size: 10.5px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  transition: all 0.3s;
}

.status-badge .dot {
  width: 7px;
  height: 7px;
  background: #00ff88;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ff88;
  animation: pulseDot 1.5s infinite;
}

.status-badge.danger {
  background: rgba(255, 77, 77, 0.08);
  border-color: rgba(255, 77, 77, 0.35);
  color: #ff4d4d;
}

.status-badge.danger .dot {
  background: #ff4d4d;
  box-shadow: 0 0 10px #ff4d4d;
}

@keyframes pulseDot {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(1.3); }
}

/* ───── USER TOP INFO ───── */
.user-top-info {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px;
  background: rgba(0, 20, 10, 0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 255, 136, 0.15);
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  animation: cardSlideIn 0.4s ease backwards;
}

.user-avatar {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.12);
  border: 2.5px solid rgba(0, 255, 136, 0.5);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 24px;
  flex-shrink: 0;
  box-shadow: 0 0 20px rgba(0, 255, 136, 0.3);
  position: relative;
}

.user-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.user-avatar::after {
  content: '';
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 12px;
  height: 12px;
  background: #00ff88;
  border: 2.5px solid #0a0a0a;
  border-radius: 50%;
  box-shadow: 0 0 10px #00ff88;
}

.user-details {
  flex: 1;
  min-width: 0;
}

.user-name {
  font-size: 16px;
  font-weight: 800;
  color: #00ff88;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.2px;
  text-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
}

.user-id {
  font-size: 11.5px;
  color: #00ff88;
  opacity: 0.6;
  font-family: 'SF Mono', 'Courier New', monospace;
  margin-bottom: 2px;
  font-weight: 600;
}

.user-handle {
  font-size: 12px;
  color: #00ff88;
  font-weight: 700;
  text-shadow: 0 0 8px rgba(0, 255, 136, 0.3);
}

/* ───── MAIN CARD ───── */
.main-card {
  background: linear-gradient(145deg,
    rgba(0, 255, 136, 0.08),
    rgba(0, 255, 136, 0.02));
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid rgba(0, 255, 136, 0.25);
  border-radius: 22px;
  padding: 20px;
  position: relative;
  overflow: hidden;
  box-shadow:
    0 8px 32px rgba(0, 0, 0, 0.5),
    inset 0 1px 0 rgba(0, 255, 136, 0.1);
  animation: cardSlideIn 0.4s ease 0.05s backwards;
}

.main-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 2px;
  background: linear-gradient(90deg,
    transparent,
    #00ff88,
    transparent);
  animation: cardShine 3s infinite;
}

@keyframes cardShine {
  0% { left: -100%; }
  100% { left: 100%; }
}

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(0, 255, 136, 0.12);
}

.card-label {
  font-size: 10.5px;
  color: #00ff88;
  letter-spacing: 1.5px;
  font-weight: 800;
  text-transform: uppercase;
  opacity: 0.85;
}

.card-status-icon {
  font-size: 22px;
  filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.4));
  transition: all 0.3s;
}

.card-content {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.card-field {
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.field-label {
  font-size: 9.5px;
  color: #00ff88;
  opacity: 0.55;
  letter-spacing: 1.5px;
  font-weight: 800;
  text-transform: uppercase;
}

.field-value {
  font-size: 15px;
  font-weight: 800;
  color: #00ff88;
  font-family: 'SF Mono', 'Courier New', monospace;
  word-break: break-all;
  letter-spacing: 0.5px;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
}

.id-value {
  color: #00ff88;
}

.name-value {
  font-family: inherit;
  font-size: 17px;
  font-weight: 800;
  color: #00ff88;
  letter-spacing: 0.2px;
}

.field-handle {
  font-size: 12.5px;
  color: #00ff88;
  opacity: 0.85;
  font-weight: 700;
}

.card-bot-photo {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid rgba(0, 255, 136, 0.12);
  display: flex;
  justify-content: center;
}

.card-bot-photo img {
  width: 85px;
  height: 85px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #00ff88;
  box-shadow:
    0 0 30px rgba(0, 255, 136, 0.5),
    0 0 60px rgba(0, 255, 136, 0.2);
  animation: botPhotoGlow 3s ease-in-out infinite alternate;
}

@keyframes botPhotoGlow {
  from {
    box-shadow:
      0 0 30px rgba(0, 255, 136, 0.5),
      0 0 60px rgba(0, 255, 136, 0.2);
  }
  to {
    box-shadow:
      0 0 45px rgba(0, 255, 136, 0.7),
      0 0 90px rgba(0, 255, 136, 0.3);
  }
}

/* ───── STATUS SECTION ───── */
.status-section {
  text-align: center;
  padding: 8px 0;
  animation: cardSlideIn 0.4s ease 0.1s backwards;
}

.status-title {
  font-size: 18px;
  font-weight: 800;
  margin-bottom: 8px;
  letter-spacing: 0.3px;
  transition: all 0.3s;
}

.status-title.error {
  color: #ff4d4d;
  text-shadow: 0 0 20px rgba(255, 77, 77, 0.4);
}

.status-title.success {
  color: #00ff88;
  text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
}

.status-subtitle {
  font-size: 12.5px;
  color: #00ff88;
  opacity: 0.65;
  line-height: 1.55;
  max-width: 320px;
  margin: 0 auto;
  font-weight: 600;
}

/* ───── BOT INFO CARD ───── */
.bot-info-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  background: rgba(0, 20, 10, 0.55);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(0, 255, 136, 0.15);
  border-radius: 18px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
  animation: cardSlideIn 0.4s ease 0.15s backwards;
  transition: all 0.3s;
}

.bot-avatar {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  background: rgba(0, 255, 136, 0.12);
  border: 2.5px solid rgba(0, 255, 136, 0.5);
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  box-shadow: 0 0 18px rgba(0, 255, 136, 0.3);
}

.bot-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.bot-details {
  flex: 1;
  min-width: 0;
}

.bot-name {
  font-size: 14px;
  font-weight: 800;
  color: #00ff88;
  margin-bottom: 3px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.3px;
  text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
}

.bot-status {
  font-size: 11.5px;
  color: #00ff88;
  opacity: 0.75;
  font-weight: 700;
}

.bot-check {
  font-size: 22px;
  color: #00ff88;
  filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.5));
  transition: all 0.3s;
}

/* ───── CONTINUE BUTTON ───── */
.continue-btn {
  width: 100%;
  background: linear-gradient(135deg, #00ff88, #00cc6a);
  color: #000000;
  border: none;
  padding: 17px;
  border-radius: 16px;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  box-shadow:
    0 8px 32px rgba(0, 255, 136, 0.4),
    inset 0 1px 0 rgba(255, 255, 255, 0.3);
  transition: transform 0.15s;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: inherit;
  position: relative;
  overflow: hidden;
  animation: cardSlideIn 0.4s ease 0.2s backwards;
}

.continue-btn::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg,
    transparent,
    rgba(255, 255, 255, 0.35),
    transparent);
  animation: btnShine 3s ease-in-out infinite;
}

@keyframes btnShine {
  0% { left: -100%; }
  100% { left: 100%; }
}

.continue-btn:active {
  transform: scale(0.97);
}

/* ───── FOOTER ───── */
.verify-footer {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-size: 11.5px;
  color: #00ff88;
  opacity: 0.55;
  padding: 8px 0;
  margin-top: auto;
  font-weight: 700;
  letter-spacing: 0.3px;
}

.lock-icon {
  font-size: 14px;
  filter: drop-shadow(0 0 8px rgba(0, 255, 136, 0.4));
}

/* ───── RESPONSIVE ───── */
@media (max-width: 380px) {
  .topbar-title { font-size: 13px; }
  .status-badge { padding: 6px 10px; font-size: 9.5px; }
  .user-name { font-size: 14px; }
  .status-title { font-size: 16px; }
  .card-bot-photo img { width: 70px; height: 70px; }
  .continue-btn { font-size: 14px; padding: 15px; }
}

/* ───── SCROLL FIX ───── */
html, body {
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: none;
}
</style>
</head>
<body>

<div class="verify-app">

  <!-- ═══ TOP BAR ═══ -->
  <header class="verify-topbar">
    <button class="back-btn" onclick="goBack()">←</button>
    <div class="topbar-title">Device Verification</div>
    <div class="status-badge" id="statusBadge">
      <span class="dot"></span>
      <span id="statusText">Checking</span>
    </div>
  </header>

  <!-- ═══ USER INFO ═══ -->
  <div class="user-top-info">
    <div class="user-avatar" id="userAvatar">
      <span id="userFallback">👤</span>
      <img id="userImg" src="" alt="" style="display:none;">
    </div>
    <div class="user-details">
      <div class="user-name" id="userName">Loading...</div>
      <div class="user-id" id="userId">ID: -</div>
      <div class="user-handle" id="userHandle">@-</div>
    </div>
  </div>

  <!-- ═══ MAIN CARD ═══ -->
  <div class="main-card" id="mainCard">
    <div class="card-header">
      <span class="card-label">Device Verification</span>
      <span class="card-status-icon" id="cardStatusIcon">⏳</span>
    </div>

    <div class="card-content">
      <div class="card-field">
        <div class="field-label">Telegram ID</div>
        <div class="field-value id-value" id="cardTelegramId">-</div>
      </div>

      <div class="card-field">
        <div class="field-label">Account</div>
        <div class="field-value name-value" id="cardName">-</div>
        <div class="field-handle" id="cardHandle">@-</div>
      </div>
    </div>

    <div class="card-bot-photo" id="cardBotPhoto" style="display:none;">
      <img id="botPhotoImg" src="" alt="Bot">
    </div>
  </div>

  <!-- ═══ STATUS ═══ -->
  <div class="status-section">
    <div class="status-title" id="statusTitle">⏳ Verifying...</div>
    <div class="status-subtitle" id="statusSubtitle">Please wait while we verify your device.</div>
  </div>

  <!-- ═══ BOT INFO ═══ -->
  <div class="bot-info-card">
    <div class="bot-avatar" id="botAvatar">
      <span>🤖</span>
      <img id="botPhotoSmall" src="" alt="Bot" style="display:none;">
    </div>
    <div class="bot-details">
      <div class="bot-name" id="botName">TASK EARN BOT</div>
      <div class="bot-status" id="botStatus">Verifying access...</div>
    </div>
    <div class="bot-check" id="botCheck">⏳</div>
  </div>

  <!-- ═══ CONTINUE BUTTON ═══ -->
  <button class="continue-btn" id="continueBtn" onclick="continueToBot()" style="display:none;">
    Continue to Bot  ›
  </button>

  <!-- ═══ FOOTER ═══ -->
  <div class="verify-footer">
    <span class="lock-icon">🔒</span>
    <span>Your access is ready when you are.</span>
  </div>

</div>

<script>
// ============================================================
// ✅ VERIFY PAGE — Complete Logic (Working Condition)
// ============================================================
const tg = window.Telegram?.WebApp;

if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
}

const userId = tg?.initDataUnsafe?.user?.id;
const tgUser = tg?.initDataUnsafe?.user;

let deviceHash = null;
let verified = false;

// ============================================================
// 🔔 TOAST
// ============================================================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();

  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);

  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ============================================================
// 🔒 DEVICE HASH GENERATOR
// ============================================================
async function generateDeviceHash() {
  const deviceData = [
    tgUser?.id || 'unknown',
    tgUser?.language_code || 'unknown',
    navigator.userAgent || '',
    navigator.platform || '',
    screen.width + 'x' + screen.height,
    Intl.DateTimeFormat().resolvedOptions().timeZone || ''
  ].join('|');

  try {
    const encoder = new TextEncoder();
    const data = encoder.encode(deviceData);
    const hashBuffer = await crypto.subtle.digest('SHA-256', data);
    const hashArray = Array.from(new Uint8Array(hashBuffer));
    const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    return hashHex;
  } catch (e) {
    let hash = 0;
    for (let i = 0; i < deviceData.length; i++) {
      hash = ((hash << 5) - hash) + deviceData.charCodeAt(i);
      hash |= 0;
    }
    return 'h_' + Math.abs(hash).toString(16);
  }
}

// ============================================================
// 👤 LOAD USER INFO
// ============================================================
function loadUserInfo() {
  if (!tgUser) return;

  document.getElementById('userName').textContent = tgUser.first_name || 'User';
  document.getElementById('userId').textContent = 'ID: ' + (tgUser.id || '-');
  document.getElementById('userHandle').textContent = tgUser.username ? '@' + tgUser.username : '@-';

  document.getElementById('cardTelegramId').textContent = tgUser.id || '-';
  document.getElementById('cardName').textContent = tgUser.first_name || 'User';
  document.getElementById('cardHandle').textContent = tgUser.username ? '@' + tgUser.username : '@-';
}

// ============================================================
// 📸 LOAD USER PHOTO
// ============================================================
async function loadUserPhoto() {
  if (!userId) return;
  try {
    const res = await fetch(`/miniapp/api/profile-photo/${userId}`);
    const data = await res.json();
    if (data.success && data.photoUrl) {
      const img = document.getElementById('userImg');
      img.src = data.photoUrl;
      img.style.display = 'block';
      document.getElementById('userFallback').style.display = 'none';
    }
  } catch (e) {}
}

// ============================================================
// 🚀 MAIN VERIFY FLOW
// ============================================================
async function runVerification() {
  if (!userId) {
    setStatus('error', '⚠️ Please open from Telegram', 'This page requires Telegram.');
    return;
  }

  try {
    // 1. Generate device hash
    document.getElementById('statusSubtitle').textContent = 'Reading device info...';
    deviceHash = await generateDeviceHash();

    // 2. Fetch verification status
    document.getElementById('statusSubtitle').textContent = 'Checking verification status...';
    const res = await fetch(`/miniapp/api/verify/${userId}`);
    const data = await res.json();

    // 3. Load bot info
    if (data.success) {
      if (data.botName) document.getElementById('botName').textContent = data.botName;
      if (data.botPhotoUrl) {
        const botImg = document.getElementById('botPhotoImg');
        botImg.src = data.botPhotoUrl;
        botImg.style.display = 'block';
        document.getElementById('cardBotPhoto').style.display = 'flex';
        const smallImg = document.getElementById('botPhotoSmall');
        smallImg.src = data.botPhotoUrl;
        smallImg.style.display = 'block';
        document.querySelector('#botAvatar span').style.display = 'none';
      }
    }

    // 4. Verification disabled → auto-success
    if (data.verifyEnabled === false) {
      setStatus('success', '✅ Verified', 'Device verification is disabled.');
      setBadge('Verified', false);
      setBotStatus('Access granted', '✅');
      document.getElementById('cardStatusIcon').textContent = '✅';
      document.getElementById('continueBtn').style.display = 'flex';
      verified = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      return;
    }

    // 5. Already verified
    if (data.verified === true) {
      setStatus('success', '✅ Already Verified', 'Your device is verified. Welcome back!');
      setBadge('Verified', false);
      setBotStatus('Account verified', '✅');
      document.getElementById('cardStatusIcon').textContent = '✅';
      document.getElementById('continueBtn').style.display = 'flex';
      verified = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      return;
    }

    // 6. Submit for verification
    document.getElementById('statusSubtitle').textContent = 'Verifying your device...';
    const submitRes = await fetch('/miniapp/api/verify/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId: userId,
        deviceHash: deviceHash
      })
    });

    const submitData = await submitRes.json();

    if (submitData.success && submitData.verified) {
      setStatus('success', '✅ Verified', 'Your device has been verified successfully!');
      setBadge('Verified', false);
      setBotStatus('Account verified', '✅');
      document.getElementById('cardStatusIcon').textContent = '✅';
      document.getElementById('continueBtn').style.display = 'flex';
      verified = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
    } else {
      const reason = submitData.reason || 'This device has already been used by another account.';
      setStatus('error', '🚫 Verification Failed', reason);
      setBadge('Blocked', true);
      setBotStatus('Access denied', '❌');
      document.getElementById('cardStatusIcon').textContent = '❌';
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('error');
    }

  } catch (e) {
    console.error('Verify error:', e);
    setStatus('error', '⚠️ Verification Error', 'Something went wrong. Please try again.');
    setBadge('Error', true);
    setBotStatus('Error', '❌');
  }
}

// ============================================================
// 🎨 STATUS HELPERS
// ============================================================
function setStatus(type, title, subtitle) {
  const titleEl = document.getElementById('statusTitle');
  titleEl.textContent = title;
  titleEl.className = 'status-title ' + (type === 'error' ? 'error' : 'success');

  document.getElementById('statusSubtitle').textContent = subtitle;
}

function setBadge(text, isDanger) {
  document.getElementById('statusText').textContent = text;
  const badge = document.getElementById('statusBadge');
  if (isDanger) {
    badge.classList.add('danger');
  } else {
    badge.classList.remove('danger');
  }
}

function setBotStatus(text, icon) {
  document.getElementById('botStatus').textContent = text;
  document.getElementById('botCheck').textContent = icon;
}

// ============================================================
// 🚀 CONTINUE TO BOT
// ============================================================
function continueToBot() {
  if (!verified) {
    showToast('❌ Verification required');
    return;
  }

  if (tg) {
    if (tg.close) {
      tg.close();
    }
  } else {
    window.location.href = '/miniapp';
  }
}

// ============================================================
// ← BACK
// ============================================================
function goBack() {
  if (tg) {
    tg.close();
  } else {
    window.history.back();
  }
}

// ============================================================
// 🎬 INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  loadUserInfo();
  await loadUserPhoto();
  await runVerification();
});

document.addEventListener('gesturestart', e => e.preventDefault());

// Expose globals
window.goBack = goBack;
window.continueToBot = continueToBot;
</script>

</body>
</html>
