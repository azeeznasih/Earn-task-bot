<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tasks</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  /* ✅ Task card - premium glow on click */
  .task-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px;
    border-radius: 16px;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    background: rgba(0, 20, 10, 0.5);
    backdrop-filter: blur(20px);
    border: 1px solid rgba(0, 255, 136, 0.15);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    animation: cardSlideIn 0.4s ease backwards;
    margin-bottom: 12px;
    position: relative;
    overflow: hidden;
  }

  .task-card:active,
  .task-card.selected {
    border-color: #00ff88;
    background: rgba(0, 255, 136, 0.06);
    box-shadow:
      0 0 25px rgba(0, 255, 136, 0.4),
      0 0 50px rgba(0, 255, 136, 0.15),
      inset 0 0 20px rgba(0, 255, 136, 0.08);
    transform: scale(0.98);
  }

  .task-card.completed {
    opacity: 0.5;
    border-color: rgba(0, 255, 136, 0.3);
    cursor: default;
  }

  .task-info {
    flex: 1;
    min-width: 0;
  }

  .task-title {
    font-weight: 800;
    font-size: 15px;
    color: #00ff88;
    margin-bottom: 6px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
  }

  .task-reward {
    color: #00ff88;
    font-size: 13px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 0 12px rgba(0, 255, 136, 0.5);
  }

  .task-type-badge {
    display: inline-block;
    font-size: 9px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(0, 255, 136, 0.12);
    border: 1px solid rgba(0, 255, 136, 0.3);
    color: #00ff88;
    margin-left: 8px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .task-btn {
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    color: #000000;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(0, 255, 136, 0.4);
    white-space: nowrap;
    flex-shrink: 0;
    margin-left: 12px;
    font-family: inherit;
    letter-spacing: 0.5px;
  }

  .task-btn.completed-btn {
    background: rgba(0, 255, 136, 0.15);
    color: #00ff88;
    border: 1px solid rgba(0, 255, 136, 0.4);
    box-shadow: none;
    cursor: default;
  }

  /* ✅ Task Detail Modal */
  #taskDetail {
    text-align: center;
    margin-bottom: 16px;
  }

  .task-detail-icon {
    font-size: 52px;
    margin-bottom: 14px;
  }

  .task-detail-title {
    font-size: 22px;
    font-weight: 800;
    color: #00ff88;
    margin-bottom: 10px;
    text-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
  }

  .task-detail-reward {
    font-size: 28px;
    font-weight: 800;
    color: #00ff88;
    margin-bottom: 18px;
    text-shadow: 0 0 30px rgba(0, 255, 136, 0.5);
  }

  .task-detail-row {
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
    font-size: 13px;
    border-bottom: 1px solid rgba(0, 255, 136, 0.08);
  }

  .task-detail-row:last-child { border-bottom: none; }
  .task-detail-label { color: #00ff88; opacity: 0.65; font-weight: 700; }
  .task-detail-value { color: #00ff88; font-weight: 800; max-width: 60%; text-align: right; word-break: break-all; }

  .task-open-btn {
    display: block;
    width: 100%;
    background: linear-gradient(135deg, #00aaff, #0088cc);
    color: #ffffff;
    text-decoration: none;
    padding: 14px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 14px;
    margin: 16px 0 10px;
    text-align: center;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(0, 170, 255, 0.4);
  }

  .task-open-btn:active { transform: scale(0.97); }

  .task-submit-btn {
    width: 100%;
    background: linear-gradient(135deg, #00ff88, #00cc6a);
    color: #000000;
    border: none;
    padding: 15px;
    border-radius: 12px;
    font-weight: 800;
    font-size: 14px;
    cursor: pointer;
    margin-top: 8px;
    box-shadow: 0 8px 24px rgba(0, 255, 136, 0.4);
    font-family: inherit;
    letter-spacing: 0.5px;
  }

  .task-submit-btn:active { transform: scale(0.97); }

  /* ✅ Refer input */
  .refer-input {
    width: 100%;
    padding: 14px;
    background: rgba(0, 20, 10, 0.6);
    border: 1px solid rgba(0, 255, 136, 0.25);
    border-radius: 12px;
    color: #00ff88;
    font-size: 14px;
    font-weight: 700;
    margin-bottom: 12px;
    outline: none;
    font-family: inherit;
  }

  .refer-input:focus {
    border-color: #00ff88;
    box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
  }

  .refer-input::placeholder {
    color: #00ff88;
    opacity: 0.4;
  }
</style>
</head>
<body>

<div class="iphone-frame">
  <div class="app">

    <!-- Page Header -->
    <div class="page-header">
      <div class="page-title">📋 Tasks</div>
      <p class="page-sub">Complete tasks & earn rewards</p>
    </div>

    <!-- Tasks List -->
    <div id="taskList" class="task-list">
      <div class="loading">⏳ Loading tasks...</div>
    </div>

    <!-- 🎯 BOTTOM NAV — Floating Pill -->
    <nav class="bottom-nav glass-nav">
      <a href="/miniapp" class="nav-item">
        <span class="nav-icon">🏠</span>
        <span class="nav-label">HOME</span>
      </a>
      <a href="/miniapp/task" class="nav-item active">
        <span class="nav-icon">📋</span>
        <span class="nav-label">TASK</span>
      </a>
      <a href="/miniapp/pay" class="nav-item">
        <span class="nav-icon">💸</span>
        <span class="nav-label">PAY</span>
      </a>
      <a href="/miniapp/profile" class="nav-item">
        <span class="nav-icon">👤</span>
        <span class="nav-label">PROFILE</span>
      </a>
    </nav>

  </div>
</div>

<!-- TASK DETAIL MODAL -->
<div class="modal" id="taskModal">
  <div class="modal-content glass">
    <div id="taskDetail"></div>
    <button onclick="closeTaskModal()" class="cancel-btn">Close</button>
  </div>
</div>

<!-- UPLOAD MODAL -->
<div class="modal" id="uploadModal">
  <div class="modal-content glass">
    <h3>📸 Upload Screenshot</h3>
    <p>Choose your proof</p>
    <input type="file" id="screenshotInput" accept="image/*" style="display:none;" onchange="handleScreenshot(event)">
    <button class="btn-primary" onclick="document.getElementById('screenshotInput').click()">📁 Choose from Gallery</button>
    <button class="cancel-btn" onclick="closeUploadModal()">❌ Cancel</button>
  </div>
</div>

<!-- REFER MODAL -->
<div class="modal" id="referModal">
  <div class="modal-content glass">
    <h3>🔗 Send Refer Link / ID</h3>
    <p>⚠️ Full Referral Link or Bot ID only</p>
    <input type="text" id="referInput" class="refer-input" placeholder="Link or ID" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button class="btn-primary" onclick="submitRefer()">✅ Submit</button>
    <button class="cancel-btn" onclick="closeReferModal()">❌ Cancel</button>
  </div>
</div>

<script>
// ============================================================
// 📋 TASK PAGE
// ============================================================
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#000000');
  tg.setBackgroundColor('#000000');
}

const userId = tg?.initDataUnsafe?.user?.id;

let allTasks = [];
let currentTask = null;
let currentTaskType = 'photo';

// ============================================================
// 🔔 TOAST
// ============================================================
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.textContent = msg;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

function escapeHtml(str) {
  return String(str ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ============================================================
// 📋 LOAD TASKS
// ============================================================
async function loadTasks() {
  const listEl = document.getElementById('taskList');

  try {
    const res = await fetch('/miniapp/api/tasks');
    const data = await res.json();

    if (!data.success || !data.tasks || data.tasks.length === 0) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <div style="font-size:16px;font-weight:800;color:#00ff88;margin-bottom:8px;">No Tasks Available</div>
          <div style="font-size:13px;">Check back later!</div>
        </div>
      `;
      return;
    }

    allTasks = data.tasks;

    let html = '';
    allTasks.forEach((task, idx) => {
      let isCompleted = task.completedUsers && task.completedUsers.includes(userId);
      let completedClass = isCompleted ? 'completed' : '';
      let btnClass = isCompleted ? 'completed-btn' : '';
      let btnText = isCompleted ? '✅ Done' : 'START';

      let typeBadge = '';
      if (task.taskType === 'refer') typeBadge = '<span class="task-type-badge">REFER</span>';
      else if (task.taskType === 'affiliate') typeBadge = '<span class="task-type-badge">LINK</span>';
      else typeBadge = '<span class="task-type-badge">PHOTO</span>';

      html += `
        <div class="task-card ${completedClass}" style="animation-delay:${idx * 0.05}s" onclick="${isCompleted ? '' : `openTask('${task.taskId}')`}">
          <div class="task-info">
            <div class="task-title">${escapeHtml(task.title)}${typeBadge}</div>
            <div class="task-reward">
              <span>💰</span>
              ₹${task.reward}
            </div>
          </div>
          <button class="task-btn ${btnClass}" ${isCompleted ? 'disabled' : ''}>${btnText}</button>
        </div>
      `;
    });

    listEl.innerHTML = html;
  } catch (e) {
    console.error('Load tasks error:', e);
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <div>Failed to load tasks</div>
      </div>
    `;
  }
}

// ============================================================
// 📋 OPEN TASK
// ============================================================
function openTask(taskId) {
  const task = allTasks.find(t => t.taskId === taskId);
  if (!task) return;

  currentTask = task;

  if (task.taskType === 'refer') currentTaskType = 'refer';
  else if (task.taskType === 'affiliate') currentTaskType = 'affiliate';
  else currentTaskType = 'photo';

  const detailEl = document.getElementById('taskDetail');

  let icon = '📋';
  if (currentTaskType === 'refer') icon = '🔗';
  else if (currentTaskType === 'affiliate') icon = '🌐';
  else icon = '📸';

  let btnLabel = '📸 Submit Screenshot';
  if (currentTaskType === 'refer') btnLabel = '🔗 Submit Refer ID';
  else if (currentTaskType === 'affiliate') btnLabel = '✅ I Completed This Task';

  detailEl.innerHTML = `
    <div class="task-detail-icon">${icon}</div>
    <div class="task-detail-title">${escapeHtml(task.title)}</div>
    <div class="task-detail-reward">₹${task.reward}</div>
    <div class="task-detail-row">
      <span class="task-detail-label">Task ID</span>
      <span class="task-detail-value">${escapeHtml(task.taskId)}</span>
    </div>
    <div class="task-detail-row">
      <span class="task-detail-label">Type</span>
      <span class="task-detail-value">${currentTaskType.toUpperCase()}</span>
    </div>
    <a href="${escapeHtml(task.link)}" target="_blank" class="task-open-btn">
      🔗 Open Task Link
    </a>
    <button class="task-submit-btn" onclick="startSubmit()">
      ${btnLabel}
    </button>
  `;

  document.getElementById('taskModal').classList.add('active');
}

function closeTaskModal() {
  document.getElementById('taskModal').classList.remove('active');
}

// ============================================================
// 📸 START SUBMIT
// ============================================================
function startSubmit() {
  closeTaskModal();

  if (currentTaskType === 'refer') {
    document.getElementById('referModal').classList.add('active');
    setTimeout(() => document.getElementById('referInput').focus(), 300);
  } else if (currentTaskType === 'affiliate') {
    // Affiliate — direct submit (user confirms completed)
    submitAffiliate();
  } else {
    document.getElementById('uploadModal').classList.add('active');
  }
}

function closeUploadModal() {
  document.getElementById('uploadModal').classList.remove('active');
  document.getElementById('screenshotInput').value = '';
}

function closeReferModal() {
  document.getElementById('referModal').classList.remove('active');
  document.getElementById('referInput').value = '';
}

// ============================================================
// 📸 SCREENSHOT UPLOAD
// ============================================================
async function handleScreenshot(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!currentTask) { showToast('❌ No task selected'); return; }

  closeUploadModal();
  showToast('⏳ Uploading...');

  try {
    const base64 = await fileToBase64(file);
    const res = await fetch('/miniapp/api/submit-task', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, taskId: currentTask.taskId, photoBase64: base64 })
    });
    const data = await res.json();

    if (data.success) {
      showToast('✅ Submitted!');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      currentTask = null;
      setTimeout(() => loadTasks(), 500);
    } else {
      showToast('❌ ' + (data.error || 'Failed'));
    }
  } catch (e) {
    console.error(e);
    showToast('❌ Network error');
  }
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ============================================================
// 🌐 SUBMIT AFFILIATE
// ============================================================
async function submitAffiliate() {
  if (!currentTask) return;
  if (!confirm('Have you completed this task?')) return;

  try {
    const res = await fetch('/miniapp/api/submit-refer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        userId,
        taskId: currentTask.taskId,
        referValue: `AFFILIATE_CLICKED: ${currentTask.link}`
      })
    });
    const data = await res.json();

    if (data.success) {
      showToast('✅ Submitted!');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      currentTask = null;
      setTimeout(() => loadTasks(), 500);
    } else {
      showToast('❌ ' + (data.error || 'Failed'));
    }
  } catch (e) {
    showToast('❌ Network error');
  }
}

// ============================================================
// 🔗 SUBMIT REFER
// ============================================================
async function submitRefer() {
  const input = document.getElementById('referInput');
  const value = input.value.trim();

  if (!value) { showToast('❌ Enter refer link or ID'); return; }
  if (!currentTask) { showToast('❌ No task selected'); return; }

  closeReferModal();
  showToast('⏳ Submitting...');

  try {
    const res = await fetch('/miniapp/api/submit-refer', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ userId, taskId: currentTask.taskId, referValue: value })
    });
    const data = await res.json();

    if (data.success) {
      showToast('✅ Refer submitted!');
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      currentTask = null;
      setTimeout(() => loadTasks(), 500);
    } else {
      showToast('❌ ' + (data.error || 'Failed'));
    }
  } catch (e) {
    showToast('❌ Network error');
  }
}

// ============================================================
// 🚀 INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  if (!userId) {
    document.getElementById('taskList').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠️</div>
        <div>Open from Telegram</div>
      </div>
    `;
    return;
  }
  await loadTasks();

  document.getElementById('referInput')?.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') submitRefer();
  });
});

document.getElementById('taskModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'taskModal') closeTaskModal();
});
document.getElementById('uploadModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'uploadModal') closeUploadModal();
});
document.getElementById('referModal')?.addEventListener('click', (e) => {
  if (e.target.id === 'referModal') closeReferModal();
});

document.addEventListener('gesturestart', e => e.preventDefault());
</script>

</body>
</html>
