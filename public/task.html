<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tasks</title>
<link rel="stylesheet" href="style.css">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="logo">TASK EARN BOT</div>
  </header>

  <div class="page-title">📋 Tasks</div>
  <p class="page-sub">Complete tasks & earn money</p>

  <div id="taskList" class="task-list">Loading...</div>

  <nav class="bottom-nav">
    <a href="/miniapp" class="nav-item">🏠<span>HOME</span></a>
    <a href="/miniapp/task" class="nav-item active">📋<span>TASK</span></a>
    <a href="/miniapp/pay" class="nav-item">💸<span>PAY</span></a>
    <a href="/miniapp/profile" class="nav-item">👤<span>PROFILE</span></a>
  </nav>

</div>

<!-- TASK DETAIL MODAL -->
<div class="modal" id="taskModal">
  <div class="modal-content">
    <div id="taskDetail"></div>
    <button onclick="closeTaskModal()" class="cancel-btn">Close</button>
  </div>
</div>

<!-- UPLOAD SCREENSHOT MODAL -->
<div class="modal" id="uploadModal">
  <div class="modal-content">
    <h3>📸 Upload Screenshot</h3>
    <p>Choose your proof</p>

    <input type="file" id="screenshotInput" accept="image/*" style="display:none;" onchange="handleScreenshot(event)">
    <button class="upload-btn" onclick="document.getElementById('screenshotInput').click()">📁 Choose from Gallery</button>

    <button class="cancel-btn" onclick="closeUploadModal()">❌ Cancel</button>
  </div>
</div>

<!-- REFER ID MODAL -->
<div class="modal" id="referModal">
  <div class="modal-content">
    <h3>🔗 Send Refer ID / Link</h3>
    <p>Send your refer ID or link as proof</p>

    <input type="text" id="referInput" placeholder="Enter refer ID or link" style="width:100%; padding:14px; background:#0a0f0a; border:1px solid #1e2e1e; border-radius:10px; color:#fff; font-size:14px; margin-bottom:12px;">

    <button class="upload-btn" onclick="submitRefer()">✅ Submit</button>
    <button class="cancel-btn" onclick="closeReferModal()">❌ Cancel</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
